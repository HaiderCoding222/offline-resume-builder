<div class="cv-pink-container">

    <!-- Mobile Tabs -->
    <div class="tmpl-mobile-tabs-container" id="pink-mobile-tabs">
        <button type="button" class="tmpl-tab-btn active" id="pink-tab-editor" onclick="pinkSwitchMobileTab('editor')">✏️ Editor</button>
        <button type="button" class="tmpl-tab-btn" id="pink-tab-preview" onclick="pinkSwitchMobileTab('preview')">👁️ Preview</button>
    </div>

    <!-- LEFT EDITOR PANEL -->
    <div class="pink-editor" id="pink-editor-panel">
        <h2 style="margin-top:0; color:#343d51; font-size:18px; border-bottom:2px solid #e2e8f0; padding-bottom:10px;">✏️ Resume Details</h2>

        <form id="pink-form" onsubmit="event.preventDefault();">

            <!-- Personal Info -->
            <div style="background:#f8fafc; padding:14px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:14px;">
                <h3 style="font-size:12px; text-transform:uppercase; color:#475569; margin-top:0; margin-bottom:12px;">Personal Info</h3>

                <!-- Photo Upload -->
                <div style="margin-bottom:12px; text-align:center;">
                    <label style="display:block; font-size:11px; font-weight:700; margin-bottom:6px; color:#475569; text-transform:uppercase;">Profile Photo</label>
                    <div id="pink-photo-preview" style="width:90px; height:90px; border-radius:8px; overflow:hidden; margin:0 auto 10px; background:#e2e8f0; border:3px solid #343d51; display:flex; align-items:center; justify-content:center;">
                        <span style="font-size:10px; color:#94a3b8;">No Photo</span>
                    </div>
                    <input type="file" id="pink-input-file" accept="image/*" style="font-size:11px; width:100%;">
                </div>

                <div style="margin-bottom:8px;">
                    <label style="display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px;">Full Name</label>
                    <input type="text" id="pink-input-name" value="Emily Brooklyn" style="width:100%; padding:8px; font-size:13px; border:1.5px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:8px;">
                    <label style="display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px;">Job Title</label>
                    <input type="text" id="pink-input-title" value="Inventory Control Manager" style="width:100%; padding:8px; font-size:13px; border:1.5px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:8px;">
                    <label style="display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px;">Phone</label>
                    <input type="text" id="pink-input-phone" value="+0123 458 7898" style="width:100%; padding:8px; font-size:13px; border:1.5px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:8px;">
                    <label style="display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px;">Email</label>
                    <input type="email" id="pink-input-email" value="yourmailid@domain.com" style="width:100%; padding:8px; font-size:13px; border:1.5px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:8px;">
                    <label style="display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px;">LinkedIn</label>
                    <input type="text" id="pink-input-linkedin" value="linkedin.com/in/yourname" style="width:100%; padding:8px; font-size:13px; border:1.5px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:8px;">
                    <label style="display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px;">Address</label>
                    <input type="text" id="pink-input-address" value="123 Street name, town/city, state/country, poct/zip." style="width:100%; padding:8px; font-size:13px; border:1.5px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
            </div>

            <!-- Dynamic Sections -->
            <div id="pink-dynamic-editor-sections"></div>

        </form>
    </div>

    <!-- RIGHT PREVIEW PANEL -->
    <div class="pink-preview" id="pink-preview-panel">

        <div class="cv-pink-content" id="cv-pink-print-area">

            <!-- ===== MAIN TABLE ===== -->
            <table class="pink-main-table">
                <tr>
                    <!-- LEFT SIDEBAR (FULL PINK BACKGROUND) -->
                    <td class="pink-sidebar">

                        <!-- Monogram / Photo Box -->
                        <div class="pink-monogram-box">
                            <div class="pink-monogram-photo" id="pink-monogram-photo"></div>
                            <div class="pink-monogram-circle" id="pink-monogram-circle">
                                <span class="pink-mono-letter pink-mono-top" id="pink-mono-top">E</span>
                                <span class="pink-mono-letter pink-mono-bottom" id="pink-mono-bottom">B</span>
                                <div class="pink-mono-diagonal"></div>
                            </div>
                        </div>

                        <!-- Dynamic Sidebar Sections -->
                        <div id="pink-sidebar-sections-container"></div>

                    </td>

                    <!-- RIGHT MAIN CONTENT -->
                    <td class="pink-main-content">

                        <!-- Name + Title -->
                        <div class="pink-name-wrapper">
                            <h1 class="pink-name-line1" id="pink-p-name1">EMILY</h1>
                            <h1 class="pink-name-line2" id="pink-p-name2">BROOKLYN</h1>
                            <div class="pink-title-bar">
                                <span class="pink-title-line pink-title-line-left"></span>
                                <span class="pink-title-text" id="pink-p-title">INVENTORY CONTROL MANAGER</span>
                                <span class="pink-title-line pink-title-line-right"></span>
                            </div>
                        </div>

                        <!-- Dynamic Main Sections -->
                        <div id="pink-main-sections-container"></div>
                    </td>
                </tr>
            </table>

            <!-- Bottom-right decorative triangle -->
            <div class="pink-bg-bottom-right"></div>

        </div>
    </div>
</div>
