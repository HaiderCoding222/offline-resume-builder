<div class="app-layout-container">
    <!-- LEFT SIDE: EDITOR PANEL -->
    <aside class="left-editor-panel">
        <div class="panel-header">
            <h2>Editor Controls</h2>
        </div>
        
        <!-- Header / Personal Info -->
        <div class="editor-section">
            <h3>Personal Info</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="tmpl-input-name" placeholder="Name">
            </div>
            <div class="form-group">
                <label>Designation / Role</label>
                <input type="text" id="tmpl-input-title" placeholder="Role">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="tmpl-input-phone" placeholder="Phone">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="tmpl-input-email" placeholder="Email">
            </div>
            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" id="tmpl-input-photo" accept="image/*">
            </div>
        </div>

        <!-- Dynamic Items Editor (Experience, Skills, Education, Profile) -->
        <div id="tmpl-dynamic-editor-sections"></div>
    </aside>

    <!-- RIGHT SIDE: LIVE PREVIEW PANEL -->
    <main class="right-preview-panel">
        <div class="paper-wrapper">
            <div class="cv-premium-container">
                <!-- Left Sidebar on Paper -->
                <div class="cv-sidebar" id="tmpl-left-sidebar">
                    <div class="cv-avatar-box">
                        <div id="tmpl-avatar" class="cv-avatar-placeholder"></div>
                    </div>
                    
                    <div id="tmpl-sidebar-dynamic-target"></div>
                </div>

                <!-- Right Main Content on Paper -->
                <div class="cv-main-content">
                    <div class="cv-header-block">
                        <h1 id="tmpl-name">Ansar Abbas</h1>
                        <h2 id="tmpl-title" class="cv-profession-sub">Senior Dispenser/Paramedic</h2>
                        <div class="cv-contact-row">
                            <span id="tmpl-phone">📞 0345-8665835</span>
                            <span id="tmpl-email">✉ hello@reallygreatsite.com</span>
                        </div>
                    </div>

                    <div id="tmpl-main-dynamic-target"></div>
                </div>
            </div>
        </div>
    </main>
</div>
