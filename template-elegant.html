<div class="cv-elegant-workspace-container" style="display:flex;gap:20px;width:100%;min-height:85vh;font-family:'Segoe UI',system-ui,sans-serif;">
    <div class="elegant-editor-sidebar" style="width:420px;background:#f8fafc;padding:20px;border-right:1px solid #e2e8f0;overflow-y:auto;max-height:85vh;flex-shrink:0;box-sizing:border-box;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:2px solid #bae6fd;padding-bottom:10px;">
            <h3 style="margin:0;color:#0f172a;font-size:18px;font-weight:700;">Elegant Core Editor</h3>
        </div>
        <form id="elegant-editor-form" onsubmit="event.preventDefault();">
            <div style="background:#ffffff;padding:12px;border-radius:6px;border:1px solid #e2e8f0;margin-bottom:15px;">
                <h4 style="margin:0 0 10px 0;font-size:13px;color:#1e3a8a;text-transform:uppercase;">Personal Details</h4>
                <div style="margin-bottom:8px;">
                    <label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">PROFILE PHOTO</label>
                    <input type="file" id="el-photo-upload" accept="image/*" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;">
                </div>
                <div style="margin-bottom:8px;"><label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">FULL NAME</label><input type="text" id="el-input-name" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;"></div>
                <div style="margin-bottom:8px;"><label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">PROFESSION TITLE</label><input type="text" id="el-input-title" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;"></div>
                <div style="margin-bottom:8px;"><label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">ABOUT ME</label><textarea id="el-input-summary" rows="3" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;resize:vertical;"></textarea></div>
                <div style="margin-bottom:8px;"><label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">PHONE</label><input type="text" id="el-input-phone" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;"></div>
                <div><label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">EMAIL</label><input type="email" id="el-input-email" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;"></div>
                <div style="margin-bottom:8px;">
                    <label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">LINKEDIN PROFILE URL</label>
                    <div style="display:flex;gap:4px;">
                        <input type="text" id="el-input-linkedin" style="flex:1;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;">
                        <button onclick="clearContactField('linkedin');" style="background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;">✕</button>
                    </div>
                </div>
                <div style="margin-bottom:8px;">
                    <label style="display:block;font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;">PERSONAL PORTFOLIO LINK</label>
                    <div style="display:flex;gap:4px;">
                        <input type="text" id="el-input-portfolio" style="flex:1;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;box-sizing:border-box;">
                        <button onclick="clearContactField('portfolio');" style="background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;">✕</button>
                    </div>
                </div>
            </div>
            <div id="elegant-dynamic-editor-fields"></div>
        </form>
    </div>
    <div class="elegant-preview-panel" style="flex:1;background:#cbd5e1;padding:20px;display:flex;justify-content:center;overflow-y:auto;max-height:85vh;">
        <div id="elegant-print-node" class="elegant-theme"></div>
    </div>
</div>
